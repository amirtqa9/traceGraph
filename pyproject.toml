[project]
name = "tracegraph"
version = "0.0.1"
description = "Verified, invalidating agent memory on top of LangGraph (M0 spike)."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<1.3",
    "langgraph-prebuilt>=1.1,<1.2",
    "langchain-core>=1.7,<1.8",
    "langgraph-checkpoint-sqlite>=3.1,<3.2",
]

[project.scripts]
tracegraph = "tracegraph.cli:main"

[project.optional-dependencies]
spike = ["langchain-anthropic>=1.7,<1.8", "langchain-ollama>=1.1,<1.2"]
dev = ["pytest>=9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
